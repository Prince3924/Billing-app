      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Electrical Zap Icon -->
  <path d="M280 40 L130 280 L250 280 L232 472 L382 232 L262 232 Z" fill="url(#bolt)" stroke="#d97706" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Billing App badge -->
